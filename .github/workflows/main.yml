name: Build Android APK
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show repository layout
        run: ls -la . android android/app/src/main/assets/www 2>&1 | head -50
      - name: Refresh bundled web app (only if web/ is in the repo)
        run: |
          if [ -d web ]; then
            rm -rf android/app/src/main/assets/www
            mkdir -p android/app/src/main/assets/www
            cp -r web/index.html web/css web/js web/data web/icons web/manifest.webmanifest android/app/src/main/assets/www/
            echo "synced web -> android assets"
          else
            echo "no web/ folder, using the copy already in android/app/src/main/assets/www"
          fi
          test -f android/app/src/main/assets/www/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: albion-calc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
